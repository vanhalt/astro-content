name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          mise_toml: mise.toml

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: mise x -- pnpm install --frozen-lockfile

      - name: Build library
        run: mise x -- pnpm build

      - name: Run e2e tests
        run: mise x -- pnpm test:e2e

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-content-dist
          path: |
            dist
            bin
            completions
          if-no-files-found: error
