name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-content-dist
          path: |
            dist
            bin
            completions
          if-no-files-found: error
